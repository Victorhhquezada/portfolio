<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1A56FF;
    --coral: #FF4C35;
    --yellow: #F5E642;
    --base: #F5F3EE;
    --ink: #0D0D0D;
    --white: #FFFFFF;
    --ink-60: rgba(13,13,13,0.6);
    --ink-40: rgba(13,13,13,0.4);
    --ink-15: rgba(13,13,13,0.15);
    --ink-08: rgba(13,13,13,0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-float: cubic-bezier(0.45, 0, 0.55, 1);

    --font-head: 'Space Grotesk', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font-body);
    font-weight: 400;
    background: var(--base);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }

  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
  }
  .reveal.in-view { opacity: 1; transform: translateY(0); }

  /* ---------- nav ---------- */
  .nav {
    position: fixed;
    top: 0; left: 0; width: 100%;
    z-index: 100;
    background: transparent;
    transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease);
  }
  .nav-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav.scrolled {
    background: rgba(245, 243, 238, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 1px 0 var(--ink-08);
  }
  .logo {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
  }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    position: relative;
    padding-bottom: 3px;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s var(--ease);
  }
  .nav-links a:hover::after { transform: scaleX(1); }

  /* ---------- error hero ---------- */
  .error-hero {
    position: relative;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    padding: 140px 0 80px;
    overflow: hidden;
  }
  .hero-shapes {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  .hero-shapes svg { width: 100%; height: 100%; }
  .float-a, .float-b, .float-c, .float-d, .float-net { transform-origin: center; }
  .float-a { animation: floatA 22s var(--ease-float) infinite; }
  .float-b { animation: floatB 26s var(--ease-float) infinite; }
  .float-c { animation: floatC 19s var(--ease-float) infinite; }
  .float-d { animation: floatD 17s var(--ease-float) infinite; }
  .float-net { animation: floatNet 16s var(--ease-float) infinite; }
  @keyframes floatA {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(20px, -16px); }
    50%  { transform: translate(6px, -30px); }
    75%  { transform: translate(-14px, -8px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes floatB {
    0%   { transform: translate(0, 0); }
    30%  { transform: translate(-22px, 14px); }
    60%  { transform: translate(-8px, 32px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes floatC {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(16px, 18px) scale(1.03); }
    66%  { transform: translate(-10px, 26px) scale(0.98); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes floatD {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-14px, 20px); }
  }
  @keyframes floatNet {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(8px, 10px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .float-a, .float-b, .float-c, .float-d, .float-net { animation: none; }
  }

  .error-content {
    position: relative;
    z-index: 2;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px;
    width: 100%;
  }
  .error-anchor {
    background: rgba(245, 243, 238, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 48px clamp(28px, 5vw, 64px);
    max-width: 720px;
    box-shadow: 0 30px 60px -20px rgba(13,13,13,0.12);
  }

  .breadcrumb { margin-bottom: 24px; }
  .breadcrumb ol {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-40);
  }
  .breadcrumb a { color: var(--ink-60); transition: color 0.3s var(--ease); }
  .breadcrumb a:hover { color: var(--ink); }

  .error-number {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: clamp(3rem, 8vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--blue);
    margin-bottom: 16px;
  }
  .eyebrow {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-60);
    border: 1px solid var(--ink-15);
    border-radius: 100px;
    padding: 7px 16px;
    margin-bottom: 20px;
  }
  .error-anchor h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .error-sub {
    font-family: var(--font-body);
    font-size: clamp(1rem, 1.4vw, 1.15rem);
    color: var(--ink-60);
    margin-top: 18px;
    max-width: 46ch;
  }
  .error-links {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 36px;
  }
  .pill-link {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px solid var(--ink-15);
    border-radius: 100px;
    padding: 12px 22px;
    transition: border-color 0.4s var(--ease), background 0.4s var(--ease), transform 0.4s var(--ease), color 0.4s var(--ease);
  }
  .pill-link:hover { border-color: var(--ink); transform: translateY(-2px); }
  .pill-link.primary { background: var(--ink); color: var(--base); border-color: var(--ink); }
  .pill-link.primary:hover { background: var(--blue); border-color: var(--blue); }

  @media (max-width: 768px) {
    .nav-inner { padding: 20px; }
    .nav-links { gap: 20px; }
    .error-hero { padding: 120px 0 60px; }
    .error-content { padding: 0 20px; }
    .error-anchor { padding: 32px 24px; border-radius: 20px; }
  }

  @media (max-width: 400px) {
    .nav-inner { padding: 16px; }
    .nav-links { gap: 12px; }
    .nav-links a { font-size: 0.66rem; }
    .logo { font-size: 1rem; }
  }
</style>
</head>

  var nav = document.getElementById('nav');
  var ticking = false;
  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
